name: Sync Hugging Face to GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hf-to-github-main
  cancel-in-progress: true

jobs:
  sync:
    name: Import Space history safely
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out canonical history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch Hugging Face main
        shell: bash
        run: |
          set -euo pipefail
          git remote add hf https://huggingface.co/spaces/Italianhype/Blum
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags hf main:refs/remotes/hf/main

      - name: Classify revision relationship
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          github_sha="$(git rev-parse refs/remotes/origin/main)"
          hf_sha="$(git rev-parse refs/remotes/hf/main)"

          github_is_ancestor=false
          hf_is_ancestor=false
          if git merge-base --is-ancestor "$github_sha" "$hf_sha"; then
            github_is_ancestor=true
          fi
          if git merge-base --is-ancestor "$hf_sha" "$github_sha"; then
            hf_is_ancestor=true
          fi

          action="$(python3 scripts/hf_sync_decision.py \
            --github-sha "$github_sha" \
            --hf-sha "$hf_sha" \
            --github-is-ancestor "$github_is_ancestor" \
            --hf-is-ancestor "$hf_is_ancestor")"

          echo "github_sha=$github_sha" >> "$GITHUB_OUTPUT"
          echo "hf_sha=$hf_sha" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

          {
            echo "## Hugging Face synchronization"
            echo ""
            echo "- GitHub main: \`$github_sha\`"
            echo "- Hugging Face main: \`$hf_sha\`"
            echo "- Decision: \`$action\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward canonical main
        id: fast_forward
        if: steps.classify.outputs.action == 'fast_forward'
        env:
          HF_SHA: ${{ steps.classify.outputs.hf_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git lfs fetch hf "$HF_SHA"
          git lfs push origin "$HF_SHA"

          if git push origin "$HF_SHA:refs/heads/main"; then
            echo "action=fast_forward" >> "$GITHUB_OUTPUT"
            echo "Fast-forwarded GitHub main to Hugging Face main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "action=pull_request" >> "$GITHUB_OUTPUT"
            echo "Main rejected the fast-forward; falling back to a review branch." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish protected review branch
        if: >-
          steps.classify.outputs.action == 'pull_request' ||
          steps.fast_forward.outputs.action == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_SHA_BASE: ${{ steps.classify.outputs.github_sha }}
          HF_SHA: ${{ steps.classify.outputs.hf_sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch="sync/hf-main"

          git lfs fetch hf "$HF_SHA"
          git lfs push origin "$HF_SHA"
          git push --force-with-lease="refs/heads/$branch" \
            origin "$HF_SHA:refs/heads/$branch"

          existing_pr="$(gh pr list \
            --base main \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "sync: review Hugging Face main" \
              --body "Hugging Face and canonical GitHub history diverged, or branch protection rejected a direct fast-forward.\n\nGitHub base: \`$GITHUB_SHA_BASE\`\nHugging Face head: \`$HF_SHA\`\n\nThis pull request preserves both histories for explicit review. It was not force-pushed to \`main\`."
          else
            echo "Reused pull request #$existing_pr." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record final outcome
        if: always()
        env:
          CLASSIFIED_ACTION: ${{ steps.classify.outputs.action }}
          FAST_FORWARD_ACTION: ${{ steps.fast_forward.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          final_action="${FAST_FORWARD_ACTION:-$CLASSIFIED_ACTION}"
          echo "- Final action: \`${final_action:-unavailable}\`" >> "$GITHUB_STEP_SUMMARY"
