name: Evidence-driven proposal
description: Propose a change that improves BLUM's decision intelligence.
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: dropdown
    id: objective
    attributes:
      label: Primary improvement
      options:
        - Evidence integrity
        - Opportunity selection
        - Entry or exit quality
        - Risk or capital control
        - Benchmark validation
        - Learning quality
        - Runtime reliability
        - Explainability
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Measured problem
      description: What limitation is observable today?
    validations:
      required: true
  - type: textarea
    id: decision_quality
    attributes:
      label: Decision-quality impact
      description: How should this improve selection, risk, learning or validation?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Define tests, benchmarks, sample thresholds and rollback.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Simpler alternatives considered
      description: Explain why existing modules or a smaller change cannot solve the measured problem.
    validations:
      required: true
  - type: checkboxes
    id: guardrails
    attributes:
      label: Guardrails
      options:
        - label: The proposal does not depend on fabricated or future data.
          required: true
        - label: The proposal has an auditable rollback path.
          required: true
        - label: The proposal does not claim guaranteed profit or unsupported alpha.
          required: true
