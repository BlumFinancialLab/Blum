name: Bug report
description: Report a reproducible defect in BLUM.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data or proprietary datasets.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the affected route, worker or engine.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps, revision and relevant non-sensitive logs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and impact
      description: Explain data integrity, financial logic or runtime impact.
