base_model: Qwen/Qwen3-4B
seed: 20260728
learning_rate: 0.0001
num_train_epochs: 3
max_length: 4096
packing: true
assistant_only_loss: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
eval_steps: 50
save_steps: 50
logging_steps: 5
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true
gradient_checkpointing: true
push_to_hub: false
report_to:
  - trackio
